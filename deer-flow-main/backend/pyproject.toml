[project]
name = "deer-flow"
version = "0.1.0"
description = "harmony-code gateway (CC-based agent backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.11",
    # Required to unit-test docker/provisioner/app.py (imports urllib3 +
    # kubernetes at module level). Dev-only so they stay out of the
    # gateway runtime.
    "urllib3>=2.0.0",
    "kubernetes>=30.0.0",
]
